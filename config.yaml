##### PRE PROCESS
pre_process:
  device: "cuda:0"
  inference_sections: ["history_of_present_illness", "observation_and_plan", "chief_complaint", "problem_list", "diagnosis"]
  autofill_sections: ["history_of_present_illness", "chief_complaint", "problem_list", "diagnosis"]

  remove_sections: ["past_medical_history", "family_history", "patient_instructions", "education",
  "patient_education", "medications", "allergies", "allergy", "imaging", "hospital_course",
  "labs_and_studies", "comments", "social_history",
  "physical_exam", "other", "user_index"]

  section_rules: "preprocess/preprocess_patterns.json"
  lang_model: "en_core_web_trf"
  note_types:
    Note Type: ["ED Provider Notes", "ED Triage Notes"]
  include_cols: ["Patient Name", "Chief Complaint", "Diagnosis", "Problem List", "CHIRPP Icon", "Note Line"]
  group_cols: ["MRN", "Arrival Date"]
  orientation: "front"
  keep_unlabelled: True
  anonymize: False

  terms_to_fix:  {'hx': 'history', '#': 'fracture', 'c/o': 'complaining of', 'f/u': 'follow up',
  'fu': 'follow up', 'w': 'with', 'ortho': 'orthopaedics', 'psych': 'psychiatry', 'cardio': 'cardiology',
  'ophtho': 'ophthalmology', 'ENT': 'otolaryngology', 'plastics': 'plastic surgery', 'physio': 'physiotherapy',
  'heme': 'hematology', 'rx': 'prescription', 'tx': 'treatment', 'd': 'days ago', 'mo': 'months', 'lac': 'laceration',
  '@': 'at', 'hpi': 'history of', 'abx': 'antibiotics', 'rom': 'range of motion', 'fx': 'fracture', 'prox': 'proximal',
  'wb': 'weight bear', 'dist': 'distal', 'min': 'miniutes', 'mins': 'minutes', 'sec': 'seconds', 'secs': 'seconds',
  'hr': 'hours', 'hrs': 'hours', 'fb': 'foreign body', 'hi': 'head injury', 'approx': 'approximately', 'sw': 'social worker',
  'sx': 'symptoms', 'sh': 'self-harm', 'pt': 'patient', "pt's": "patient's", 'r': 'right', 'rt': 'right', 'l': 'left',
  'lt': 'left', 'ft': 'feet', 'm': 'meters', 'mm': 'millimeters', 'cm': 'centimeters', 'km/h': 'kilometers per hour',
  'kmph': 'kilometers per hour', 'kph': 'kilometers per hour', 'km': 'kilometers', 'bsa': 'Body Surface Area',
  'tbsa': 'Total Body Surface Area', 'ed': 'emergency department', 'pip': 'proximal interphalangeal joint',
  'mt': 'metatarsal', 'hep b': 'Hepatitis B', 'loonie': '$1 coin', 'toonie': '$2 coin', 'OCD': 'Obsessive-Compulsive Disorder',
  'ADHD': 'Attention Deficit Hyperactivity Disorder', 'BPD': 'Borderline Personality Disorder', 'PTSD': 'Post-Traumatic Stress Disorder',
  'MDD': 'Major Depressive Disorder', 'GDD': 'Global Developmental Delay', 'ASD': 'Autism Spectrum Disorder', 'GAD': 'Generalized Anxiety Disorder',
  'ODD': 'Oppositional Defiant Disorder', 'LD': 'learning disability', 'DMDD': 'Disruptive Mood Dysregulation Disorder',
  'NAFLD': 'Non-alcoholic Fatty Liver Disease', 'foosh': 'fall on an outstretched hand', 'TMJ': 'Temporomandibular Joint',
  'MCP': 'metacarpophalangeal', 'OD': 'overdose', 'GnRH': 'Gonadotropin-Releasing Hormone', 'trans': 'transgender',
  'WIC': 'walk-in clinic', 'si': 'suicidal ideations', 'LOC': 'altered level of consciousness', 'CT': 'Computed Tomography',
  'TTC': 'Toronto Transit Commission', 'FMD': 'family medical doctor', 'PCP': 'primary care provider',
  'PMD': 'doctor of primary medicine', 'MVC': 'motor vehicle collision', 'EMS': 'Emergency Medical Services',
  'EKG': 'electrocardiogram', 'ECG': 'electrocardiogram', 'NBNB': 'non-bloody, non-bilious',
  'dw': 'discussed with', 'RUQ': 'right upper quadrant', 'yo': 'year old' }



###### INFERENCE ########
inference:
  num_labels: 2
  include_labels: false
  max_length: 128
  truncation: true
  cutoff: 0.9

  #TODO change to production paths
  classification_model: "distilbert"
  summarization_model: "t5-small"
  distance_model: "all-mpnet-base-v2"
  zshot_model: "facebook/bart-large-mnli"

  note_col: "Note Text"
  use_chirpp: true
  chirpp_col: "CHIRPP Icon"


  pos_complaints: [ "Oral / Esophageal Foreign Body", "Upper Extremity Injury", "Lower Extremity Injury",
    "Burn", "Anxiety / Situational Crisis", "Head Injury", "Medical Device Problem",
    "Depression / Suicidal / Deliberate Self Harm", "Paediatric Disruptive Behaviour",
    "Laceration/Puncture", "Abrasion", "Neck Trauma", "Noxious Inhalation", "Foreign Body, Nose",
    "Post-operative Complications", "Overdose Ingestion", "Bizarre Behaviour", "Cast Check",
    "Foreign Body Ear", "Major Trauma - Penetrating", "Eye Trauma", "Concern For Patient Welfare",
    "Suture / Staple Removal", "Major Trauma - Blunt", "Foreign Body, Skin", "Violent / Homicidal Behaviour",
    "Sexual Assault", "Substance Misuse / Intoxication", "Hypothermia", "Traumatic Back / Spine Injury",
    "Nasal Trauma", "Foreign Body, Eye", "Respiratory Foreign Body", "Bite", "Facial Trauma",
    "Chemical Exposure, Eye", "Genital Trauma", "Amputation", "Social Problem", "Hallucinations / Delusions",
    "Insomnia", "Ear Injury", "Chemical Exposure", "Foreign Body in Rectum", "Isolated Chest Trauma - Blunt",
    "Isolated Abdominal Trauma - Blunt", "Anal / Rectal Trauma", "Multisystem Trauma - Blunt", "Foreign Body, Vagina",
    "Body Fluid Exposure", "Ring Removal", "Multisystem Trauma - Penetrating", "Near Drowning", "Isolated Abdominal Trauma - Penetrating",
    "Isolated Chest Trauma - Penetrating", "Substance Withdrawal", "Electrical Injury", "Frostbite / Cold Injury",
    "Cardiac Arrest (Traumatic)", "Foreign Body in Eye" ]

  inj_list: ["bruise", "abrasion", "laceration", "wound", "cut", "fracture", "dislocation",
             "sprain", "strain", "trauma", "injury", "burn", "exposure", "hemorrahage",
             "foreign body", "concussion", "poisoning", "drowning", "amputation", "rupture",
             "tear", "contusion", "avulsion", "accident", "bite", "blister", "bruised", "bruising",
             "dislocated", "electric", "electrical", "hematoma", "heamatoma", "fractured"]


  sports_labels: ["involving sports", "not involving sports"]
  io_labels: ["indoors", "outdoors"]

  final_columns: ["MRN", "Arrival Date", "Note Text", "probs", "summary", "cosine_similarity", "Diagnosis",
               "Problem List", "Chief Complaint"]



###### POST PROCESS ######
post_process:
  cc_filter: ['depression / suicidal / deliberate self harm', 'ingestion', 'chemical', 'burn',
  'concern for patient wellfare', 'overdose ingestion', 'substance misuse / intoxication',
  'vomiting and/or nausea', 'behaviour', 'altered level Of consciousness']

  diag_pl_filter: ['ingestion', 'poisoning', 'overdose', 'exposure', 'anxiety', 'substance',
                   'intoxication', 'chemical', 'depression', 'suicidal','depressive', 'crisis',
                   'instability', 'burn', 'self-harm', 'vomitting', 'irritation', 'suicide',
                   'depressed', 'anorexia nervosa', 'caustic', 'corrosive']


  report_header: ["MRN", "ScrMRN", "DOB", "SEX", "POSTAL", "ER Time", "ER Date", "INJ DATE", "Hr", "Min", "AM/PM",
  "I/O", "LOCATION", "AREA", "PLACE", "Diagnosis", "SK Narrative", "PHAC Narrative", "W4P", "NO1", "BP1", "NO2",
  "BP2", "NO3", "BP3", "Notes", 'LOS', "DISP", "IN", "sub", "subID", 'sd1', "sd2", "sd3", "sd4", "sd5", "SPORTS CODE",
  "E1", "E2", "E3", "E4", "CTAS", "Chief Complaint", "Problem List", "probs", "pre_processed", "Disposition", "cosine_similarity"]


  note_types: ['Transfer In / Advice Note', 'ED Triage Notes', 'ED Trauma Note', 'ED Trauma Notes',
            'ED Provider Notes', 'Assessment & Plan Note','ED Procedure Note', 'Procedures',
            'PS Initial Consult', 'Consults', 'Consult Follow Up', 'Op Note', 'Admission', 'Progress Notes', 'Discharge Summary']

  intent_filters:
    13:
      pre_processed: ["CAS", "SCAN"]
      Diagnosis: ["non-accidental", "child abuse", "neglect"]
    12:
      pre_processed: ["sexual"]
      Diagnosis: ["sexual"]
    15:
      pre_processed: ["assault", "attacked", "stabbed", "punched", "assaulted",
                         "shot", "stab", "beaten", "assaulted"]
      Diagnosis: ["assault"]
    11:
      Chief Complaint: ["Depression / Suicidal / Deliberate Self Harm", "Anxiety / Situational Crisis"]
      Diagnosis: ["suicidial", "suicide", "self harm", "self-harm", "depression", "overdose"]
    19:
      Diagnosis: ["post-operative", "postoperative"]
      Chief Complaint: ["Post-operative Complications", "Medical Device Problem"]

  intent_order: [11, 15, 12, 13, 19]



